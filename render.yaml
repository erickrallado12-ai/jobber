services:
  - type: static_site
    name: jobber-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/.next/static
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
        value: https://jobber-api.onrender.com

  - type: web
    name: jobber-api
    runtime: python
    buildCommand: cd deploy/merged-backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd deploy/merged-backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GATEWAY_DATABASE_URL
        fromDatabase:
          name: jobber-db
          property: connectionString
      - key: GATEWAY_JWT_SECRET
        generateValue: true
      - key: GATEWAY_OPENAI_API_KEY
        sync: false
      - key: GATEWAY_CORS_ORIGINS
        sync: false
        value: '["https://jobber-frontend.onrender.com"]'

  - type: postgresql
    name: jobber-db
    database: matchmaking
    user: matchmaking
    plan: free
    ipAllowList: []
